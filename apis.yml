aid: funnel-leasing
name: Funnel Leasing
description: >-
  Funnel Leasing provides AI-infused CRM and property management software for
  multifamily (apartment) operators. The platform centralizes the leasing
  lifecycle from prospect to resident with a next-generation CRM, an AI Virtual
  Leasing Agent, voice AI insights, marketing automation, and a resident portal
  (Nestio ResApp), and integrates with property management systems including
  Yardi, RentManager, and Entrata. Funnel exposes a Customer API for
  single-account integrations (creating prospects, scheduling tours, and
  processing lease applications) and a Partner API for reusable, multi-customer
  integrations, plus an outbound webhooks surface. Formerly known as Nestio.
