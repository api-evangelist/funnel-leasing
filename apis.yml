apis:
- name: Funnel Customer API
  description: >-
    Single-customer integration API for the Funnel leasing platform — create
    prospects in the CRM, schedule property tours/appointments, and process
    lease applications. Resources include Appointments, Community, Discovery
    Sources, Document, Employee Group, Lease, Lease Transaction, Listings,
    Pricing Matrix, Prospect, and Quote. Authenticates with HTTP Basic (API key
    as username, blank password) over HTTPS.
  humanURL: https://developer.funnelleasing.com/apis/customer-api
  baseURL: https://api.funnelleasing.com
  tags:
  - CRM
  - Leasing
  - Prospects
  - Appointments
  properties:
  - type: Documentation
    url: https://developer.funnelleasing.com/apis/customer-api
  - type: Authentication
    url: https://developer.funnelleasing.com/apis/customer-api/authentication
- name: Funnel Partner API
  description: >-
    Reusable, multi-customer integration API for partners and platform providers
    (not tied to a single customer account). Areas include Appointment Booking,
    Community Details, Prospects & Leads, Communications & Chat, Tasks, Team
    Management, Custom Scoring, Renewal Status, and ResidentApp. Authenticates
    with HTTP Basic or a Bearer token.
  humanURL: https://developer.funnelleasing.com/apis/partner-api
  baseURL: https://api.funnelleasing.com
